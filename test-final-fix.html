<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Fix Test - ILM Extension</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .warning { background: #fff3cd; color: #856404; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        h2 { color: #333; border-bottom: 2px solid #4CAF50; padding-bottom: 5px; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 3px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔧 Final Fix Verification</h1>
    
    <div class="status info">
        <strong>Note:</strong> This page tests the fixed modules in isolation. 
        Open the browser console to see detailed logs.
    </div>

    <h2>Test Results</h2>
    <div id="results"></div>

    <h2>Sample Text</h2>
    <p>The quick brown fox jumps over the lazy dog. Testing vocabulary analysis functionality.</p>

    <script>
        const results = document.getElementById('results');
        
        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.textContent = message;
            results.appendChild(div);
        }

        // Test Chrome API availability
        if (typeof chrome !== 'undefined' && chrome.storage && chrome.storage.local) {
            log('✅ Chrome storage API is available', 'success');
        } else {
            log('⚠️ Chrome storage API not available (fallback mode)', 'warning');
        }

        // Load modules one by one with error handling
        const loadModule = (path, name) => {
            return new Promise((resolve) => {
                const script = document.createElement('script');
                script.src = path;
                script.onload = () => {
                    log(`✅ ${name} loaded successfully`, 'success');
                    resolve(true);
                };
                script.onerror = () => {
                    log(`❌ Failed to load ${name}`, 'error');
                    resolve(false);
                };
                document.head.appendChild(script);
            });
        };

        // Sequential loading to avoid conflicts
        async function runTests() {
            log('Starting module tests...', 'info');
            
            // Load TextAnalyzer
            await loadModule('core/text-analyzer.js', 'TextAnalyzer');
            
            // Test TextAnalyzer if loaded
            setTimeout(() => {
                if (window.ilmTextAnalyzer) {
                    try {
                        const analysis = window.ilmTextAnalyzer.analyzeText('Test text analysis');
                        log(`✅ TextAnalyzer working: ${analysis.wordCount} words analyzed`, 'success');
                    } catch (e) {
                        log(`❌ TextAnalyzer error: ${e.message}`, 'error');
                    }
                } else {
                    log('⚠️ TextAnalyzer not initialized', 'warning');
                }
            }, 500);
            
            // Load WordProcessor
            await loadModule('core/word-processor.js', 'WordProcessor');
            
            // Test WordProcessor if loaded
            setTimeout(() => {
                if (window.ilmWordProcessor) {
                    log('✅ WordProcessor initialized', 'success');
                } else {
                    log('⚠️ WordProcessor not initialized', 'warning');
                }
            }, 1000);
            
            log('Test complete! Check console for details.', 'info');
        }

        // Run tests after page loads
        window.addEventListener('load', runTests);
    </script>
</body>
</html>
